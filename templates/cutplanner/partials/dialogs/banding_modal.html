<dialog id="banding_modal" class="modal">
    <div class="modal-box max-w-sm">
        <h3 class="font-black text-xl mb-6">Add New Edge Banding</h3>

        <form hx-post="{% url 'add_edge' %}" 
              hx-target="#edge-table-body" 
              hx-swap="beforeend"
              hx-on::after-request="this.reset()"
              @submit.prevent="banding_modal.close()" 
              class="space-y-4">

            <div class="form-control">
                <label class="label text-[10px] uppercase font-black">Edge Name</label>
                <input type="text" name="name" class="input input-bordered w-full font-bold" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="form-control">
                    <label class="label text-[10px] uppercase font-black">Thickness (mm)</label>
                    <input type="number" name="thickness" step="0.1" min="0"
                        class="input input-bordered w-full font-bold text-center" required
                        @input="$el.value = Math.abs($el.value)">
                </div>
                <div class="form-control">
                    <label class="label text-[10px] uppercase font-black">Price / m</label>
                    <input type="number" name="price" step="0.01" min="0"
                        class="input input-bordered w-full font-bold text-center"
                        @input="$el.value = Math.abs($el.value)">
                </div>
            </div>

            <div class="modal-action">
                <button type="button" class="btn btn-ghost" @click="banding_modal.close()">Cancel</button>
                <button type="submit" class="btn btn-primary px-8 text-white">Create</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
