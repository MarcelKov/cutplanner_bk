<div class="card bg-base-100 shadow-sm border border-base-300">
    <div class="card-body p-4">
        <h3 class="font-bold text-xs uppercase tracking-widest text-primary mb-4">Inventory</h3>

        <template x-for="(sheet, sIndex) in optimizationResults.sheets" :key="sIndex">
            <div class="collapse collapse-arrow bg-base-200 mb-2 border border-base-300">
                <input type="checkbox" checked />
                <div class="collapse-title text-sm font-bold flex justify-between items-center">
                    <div>
                        <span x-text="sheet.label"></span>
                        <span class="opacity-50 font-normal ml-2 text-xs"
                            x-text="`(${sheet.width} x ${sheet.height} mm)`"></span>
                    </div>
                </div>
                <div class="collapse-content p-0">
                    <table class="table table-sm table-zebra w-full bg-white">
                        <thead class="text-[10px] uppercase font-bold opacity-60">
                            <tr>
                                <th>Qty</th>
                                <th>Label</th>
                                <th class="text-right">Size</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="item in getGroupedParts(sheet.parts)" :key="item.label + item.w + item.h">
                                <tr>
                                    <td class="font-black text-primary" x-text="`${item.count}x` "></td>
                                    <td class="font-medium text-xs" x-text="item.label"></td>
                                    <td class="text-right text-[10px] font-mono" x-text="`${item.w} x ${item.h}`"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>
    </div>
</div>

<div class="card bg-base-100 shadow-sm border border-base-300" x-show="optimizationResults.cuts.length > 0">
    <div class="collapse collapse-arrow">
        <input type="checkbox" />
        <div class="collapse-title p-5">
            <h3 class="font-bold text-xs uppercase tracking-widest text-primary">All Cuts List</h3>
            <p class="text-[10px] opacity-50 uppercase font-bold text-black mt-1"
                x-text="`${optimizationResults.cuts.filter(c => c.sheet_uid === optimizationResults.sheets[currentSheetIndex].uid).length} cuts on this sheet`">
            </p>
        </div>
        <div class="collapse-content px-5 pb-5">
            <div class="overflow-y-auto max-h-80 border border-base-200 rounded-lg">
                <table class="table table-xs w-full table-pin-rows">
                    <thead>
                        <tr class="opacity-50 text-black bg-base-100">
                            <th>#</th>
                            <th>Type</th>
                            <th>Lenght</th>
                            <th>Position</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template
                            x-for="(cut, index) in optimizationResults.cuts.filter(c => c.sheet_uid === optimizationResults.sheets[currentSheetIndex].uid)"
                            :key="cut.id">
                            <tr class="hover:bg-primary hover:text-primary-content cursor-help transition-colors border-base-100"
                                @mouseenter="highlightCut(cut, true)" @mouseleave="highlightCut(cut, false)">

                                <td class="font-mono opacity-50 text-[10px]" x-text="index + 1"></td>

                                <td>
                                    <span class="badge badge-outline badge-xs uppercase font-bold text-[9px]"
                                        :class="cut.x1 === cut.x2 ? 'badge-info' : 'badge-warning'"
                                        x-text="cut.x1 === cut.x2 ? 'Vertical' : 'Horizontal'">
                                    </span>
                                </td>

                                <td class="font-bold text-xs text-right">
                                    <span x-text="`${(cut.length / 1000).toFixed(2)}m` "></span>
                                </td>

                                <td class="font-mono text-[10px] opacity-70">
                                    <div class="flex items-center gap-1">
                                        <span x-text="`${Math.round(cut.x1)},${Math.round(cut.y1)}` "></span>
                                        <span class="opacity-40">→</span>
                                        <span x-text="`${Math.round(cut.x2)},${Math.round(cut.y2)}` "></span>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
