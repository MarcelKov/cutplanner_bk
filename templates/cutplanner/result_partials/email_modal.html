<dialog id="email_modal" class="modal" @close="recipientList = []; recipientEmail = ''">
    <div class="modal-box w-11/12 max-w-2xl bg-base-100 border-t-4" style="border-color: oklch(58% 0.233 277.117);">
        <h3 class="font-bold text-lg text-primary uppercase">Send via Email</h3>
        <p class="py-2 text-sm opacity-70 border-b mb-4">Fill the recipients.</p>

        <div class="py-4">
            <div class="flex flex-col gap-1">
                <label class="label p-0 pb-1 h-6"> <span class="label-text-alt text-error font-medium"
                        x-show="emailErrorMessage" x-text="emailErrorMessage"
                        x-transition:enter="transition ease-out duration-200"
                        x-transition:enter-start="opacity-0 -translate-y-1"
                        x-transition:enter-end="opacity-100 translate-y-0">
                    </span>
                </label>

                <div class="flex gap-2">
                    <input type="email" x-model="recipientEmail" @keydown.enter.prevent="addEmail()"
                        placeholder="example@email.com" class="input input-bordered w-full transition-all"
                        :class="emailErrorMessage ? 'input-error shadow-sm' : ''" />

                    <button type="button" class="btn btn-primary px-8" @click="addEmail()">
                        Add
                    </button>
                </div>
            </div>

            <div class="flex flex-wrap gap-2 mt-6 min-h-[40px]">
                <template x-for="(email, index) in recipientList" :key="index">
                    <div class="badge badge-lg py-4 gap-2 bg-primary/10 text-primary border-primary/20">
                        <span x-text="email"></span>
                        <button @click="removeEmail(index)" class="hover:text-error transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </template>
                <template x-if="recipientList.length === 0">
                    <div class="w-full text-center py-4 opacity-40 italic text-xs">
                        Recipient list is empty...
                    </div>
                </template>
            </div>
        </div>

        <div class="modal-action flex justify-between items-center border-t pt-4">
            <div class="text-xs opacity-50 px-2">
                <span x-show="recipientList.length === 0">Please add at least one email.</span>
                <span x-show="recipientList.length > 0" x-text="`Selected recipients: ${recipientList.length}`"></span>
            </div>

            <div class="flex gap-2">
                <button type="button" class="btn btn-ghost" @click="email_modal.close()">
                    Cancel
                </button>

                <button class="btn btn-primary px-8" :disabled="recipientList.length === 0 || isSending"
                    @click="sendViaEmail()">
                    <span x-show="isSending" class="loading loading-spinner loading-xs"></span>
                    <span x-show="!isSending">Send Plan</span>
                </button>
            </div>
        </div>

        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
</dialog>
