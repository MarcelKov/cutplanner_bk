<div class="overflow-x-auto bg-base-100 rounded-2xl border border-base-200 shadow-sm">
    <table class="table table-zebra w-full">
        <thead>
            <tr class="bg-base-200/50">
                <th class="text-xs uppercase opacity-60">Name</th>
                <th class="text-xs uppercase opacity-60 text-center">Thickness (mm)</th>
                <th class="text-xs uppercase opacity-60 text-center">Grain</th>
                <th class="text-xs uppercase opacity-60 text-center">Price / m²</th>
                <th class="text-xs uppercase opacity-60 text-right">Actions</th>
            </tr>
        </thead>
        <tbody id="material-table-body">
            {% for material in materials %}
                {% include "inventory/partials/material/material_row.html" %}
            {% empty %}
                <tr id="no-materials-row">
                    <td colspan="5" class="text-center py-10 opacity-50 italic">
                        No materials added yet.
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
