<tr id="panel-row-{{ panel.id }}" class="bg-primary/5 border-y-2 border-primary/20" hx-include="this">
    <td>
        <input type="text" name="label" value="{{ panel.label }}" 
               class="input input-bordered input-sm w-full font-bold uppercase text-xs">
    </td>
    <td class="text-center">
        <div class="flex items-center justify-center gap-1">
            <input type="number" name="length" value="{{ panel.length|stringformat:'.1f' }}" step="0.1"
                   class="input input-bordered input-sm w-16 text-center font-mono text-xs" @input="$el.value = Math.abs($el.value)">
            <span class="opacity-30">×</span>
            <input type="number" name="width" value="{{ panel.width|stringformat:'.1f' }}" step="0.1"
                   class="input input-bordered input-sm w-16 text-center font-mono text-xs" @input="$el.value = Math.abs($el.value)">
        </div>
    </td>
    <td class="text-center">
        <input type="number" name="quantity" value="{{ panel.quantity }}" min="1"
               class="input input-bordered input-sm w-12 text-center font-bold" 
               @blur="$el.value = Math.max(1, Math.floor(Math.abs($el.value)) || 1)">
    </td>
    <td>
        <select name="material" class="select select-bordered select-sm w-full text-xs font-bold">
            <option value="">---</option>
            {% for m in materials %}
            <option value="{{ m.id }}" {% if panel.material.id == m.id %}selected{% endif %}>{{ m.name }}</option>
            {% endfor %}
        </select>
    </td>
    
    <td class="text-center">
        <div class="flex flex-col gap-1 items-center bg-base-100 p-1 rounded border border-base-300">
            <div class="grid grid-cols-2 gap-x-1 gap-y-1">
                
                <select name="edge_top" class="select select-ghost select-xs w-20 text-[9px] px-1 h-5 min-h-0 border border-base-200">
                    <option value="">T: None</option>
                    {% for e in edges %}
                    <option value="{{ e.id }}" {% if panel.edge_top.id == e.id %}selected{% endif %}>T: {{ e.name|truncatechars:8 }}</option>
                    {% endfor %}
                </select>

                <select name="edge_bottom" class="select select-ghost select-xs w-20 text-[9px] px-1 h-5 min-h-0 border border-base-200">
                    <option value="">B: None</option>
                    {% for e in edges %}
                    <option value="{{ e.id }}" {% if panel.edge_bottom.id == e.id %}selected{% endif %}>B: {{ e.name|truncatechars:8 }}</option>
                    {% endfor %}
                </select>

                <select name="edge_left" class="select select-ghost select-xs w-20 text-[9px] px-1 h-5 min-h-0 border border-base-200">
                    <option value="">L: None</option>
                    {% for e in edges %}
                    <option value="{{ e.id }}" {% if panel.edge_left.id == e.id %}selected{% endif %}>L: {{ e.name|truncatechars:8 }}</option>
                    {% endfor %}
                </select>

                <select name="edge_right" class="select select-ghost select-xs w-20 text-[9px] px-1 h-5 min-h-0 border border-base-200">
                    <option value="">R: None</option>
                    {% for e in edges %}
                    <option value="{{ e.id }}" {% if panel.edge_right.id == e.id %}selected{% endif %}>R: {{ e.name|truncatechars:8 }}</option>
                    {% endfor %}
                </select>

            </div>
        </div>
    </td>

    <td class="text-right pl-2">
        <div class="flex flex-col gap-1">
            <button hx-post="{% url 'edit_panel' panel.id %}" hx-target="#panel-row-{{ panel.id }}" hx-swap="outerHTML"
                    class="btn btn-primary btn-xs font-black uppercase">Save</button>
            <button hx-get="{% url 'get_panel_row' panel.id %}" hx-target="#panel-row-{{ panel.id }}" hx-swap="outerHTML"
                    class="btn btn-ghost btn-xs font-black uppercase">Cancel</button>
        </div>
    </td>
</tr>
