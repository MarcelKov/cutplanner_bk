<div class="flex flex-col h-full animate-in fade-in duration-200">
    {% include "inventory/partials/furniture/furniture_header.html" %}
    <div class="flex-1 overflow-y-auto">
        <table class="table table-zebra w-full border-separate border-spacing-0">
            <thead class="sticky top-0 bg-base-100 z-10 shadow-sm">
                <tr class="text-[10px] uppercase opacity-60">
                    <th class="bg-base-100">Label</th>
                    <th class="bg-base-100 text-center">Dimensions (mm)</th>
                    <th class="bg-base-100 text-center">Qty</th>
                    <th class="bg-base-100">Material</th>
                    <th class="bg-base-100 text-center">Edges</th>
                    <th class="bg-base-100 text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="panel-rows-{{ furniture.id }}">
                {% for panel in furniture.parts.all %}
                {% include "inventory/partials/furniture/panel_row.html" %}
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="p-4 border-t-4 border-primary/10 bg-base-200/30">
        <form hx-post="{% url 'add_panel' furniture.id %}" hx-target="#panel-rows-{{ furniture.id }}"
            hx-swap="beforeend" hx-on::after-request="if(event.detail.successful) this.reset()">

            <div class="flex flex-col gap-4">
                <div class="flex gap-3 items-end">
                    <div class="flex-1">
                        <label class="label py-0"><span class="label-text text-[10px] font-black uppercase">Part
                                Label</span></label>
                        <input type="text" name="label" placeholder="..."
                            class="input input-sm input-bordered w-full font-bold">
                    </div>
                    <div>
                        <label class="label py-0"><span class="label-text text-[10px] font-black uppercase">Dimensions
                                (mm)</span></label>
                        <div class="flex items-center gap-1">
                            <input type="number" name="length" required step="0.1" placeholder="Lenght"
                                class="input input-sm input-bordered w-20 text-center font-bold"
                                @input="$el.value = Math.abs($el.value)">
                            <span class="opacity-30">×</span>
                            <input type="number" name="width" required step="0.1" placeholder="Width"
                                class="input input-sm input-bordered w-20 text-center font-bold"
                                @input="$el.value = Math.abs($el.value)">
                        </div>
                    </div>
                    <div>
                        <label class="label py-0"><span
                                class="label-text text-[10px] font-black uppercase">Qty</span></label>
                        <input type="number" name="quantity" value="1" min="1"
                            class="input input-sm input-bordered w-14 text-center font-bold"
                            @blur="$el.value = Math.max(1, Math.floor(Math.abs($el.value)) || 1)">
                    </div>
                </div>

                <div class="flex gap-3 items-end border-t border-base-300 pt-3">
                    <div class="flex-1">
                        <label class="label py-0"><span
                                class="label-text text-[10px] font-black uppercase">Material</span></label>
                        <select name="material" class="select select-sm select-bordered w-full font-bold">
                            <option value="">---</option>
                            {% for m in materials %}
                            <option value="{{ m.id }}">{{ m.name }} ({{ m.thickness }}mm)</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="flex flex-wrap gap-2 bg-base-100 p-2 rounded-lg border border-base-300 relative">
                        <div class="flex flex-col justify-center px-1 border-r border-base-200 mr-1 opacity-60">
                            <span class="text-[10px] font-black uppercase leading-none">Edge</span>
                            <span class="text-[10px] font-black uppercase leading-none">Bandings</span>
                        </div>

                        <div class="flex flex-col">
                            <label
                                class="text-[8px] font-black opacity-40 uppercase italic mb-1 text-center">Top</label>
                            <select name="edge_top" class="select select-bordered select-xs w-24 font-bold">
                                <option value="">None</option>
                                {% for e in edges %}
                                <option value="{{ e.id }}">{{ e.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="flex flex-col border-l border-base-200 pl-2">
                            <label
                                class="text-[8px] font-black opacity-40 uppercase italic mb-1 text-center">Bottom</label>
                            <select name="edge_bottom" class="select select-bordered select-xs w-24 font-bold">
                                <option value="">None</option>
                                {% for e in edges %}
                                <option value="{{ e.id }}">{{ e.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="flex flex-col border-l border-base-200 pl-2">
                            <label
                                class="text-[8px] font-black opacity-40 uppercase italic mb-1 text-center">Left</label>
                            <select name="edge_left" class="select select-bordered select-xs w-24 font-bold">
                                <option value="">None</option>
                                {% for e in edges %}
                                <option value="{{ e.id }}">{{ e.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="flex flex-col border-l border-base-200 pl-2">
                            <label
                                class="text-[8px] font-black opacity-40 uppercase italic mb-1 text-center">Right</label>
                            <select name="edge_right" class="select select-bordered select-xs w-24 font-bold">
                                <option value="">None</option>
                                {% for e in edges %}
                                <option value="{{ e.id }}">{{ e.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-sm px-6 font-black uppercase shadow-md">Add Part</button>
                </div>
            </div>
        </form>
    </div>
</div>

<dialog id="edge_detail_modal" class="modal">
    <div class="modal-box max-w-xs p-0 overflow-hidden" id="edge-modal-content">
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
