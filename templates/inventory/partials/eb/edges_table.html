<div x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4">
    <div class="bg-base-100 rounded-2xl border border-base-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="table table-zebra w-full border-separate border-spacing-0">
                <thead>
                    <tr class="bg-base-200/50">
                        <th class="text-xs uppercase opacity-60">Name</th>
                        <th class="text-xs uppercase opacity-60 text-center">Thickness (mm)</th>
                        <th class="text-xs uppercase opacity-60 text-center">Price / m</th>
                        <th class="text-xs uppercase opacity-60 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="edge-table-body">
                    {% for edge in edges %}
                        {% include "inventory/partials/eb/edge_row.html" %}
                    {% empty %}
                        <tr id="no-edges-row">
                            <td colspan="4" class="text-center py-10 opacity-50 italic">
                                No edge bandings added yet.
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="p-4 border-t-4 border-primary/10 bg-base-200/30">
            <form hx-post="{% url 'add_edge' %}" 
                  hx-target="#edge-table-body" 
                  hx-swap="beforeend"
                  hx-on::after-request="if(event.detail.successful) { 
                      this.reset(); 
                      if(document.getElementById('no-edges-row')) document.getElementById('no-edges-row').remove(); 
                  }">
                <div class="flex gap-3 items-end">
                    <div class="flex-1">
                        <label class="label py-0">
                            <span class="label-text text-[10px] font-black uppercase">Edge Name</span>
                        </label>
                        <input type="text" name="name" placeholder="..." required
                               class="input input-sm input-bordered w-full font-bold">
                    </div>

                    <div class="w-32">
                        <label class="label py-0">
                            <span class="label-text text-[10px] font-black uppercase">Thickness (mm)</span>
                        </label>
                        <input type="number" name="thickness" step="0.1" min="0" placeholder="0.0" required
                               class="input input-sm input-bordered w-full text-center font-bold"
                               @input="$el.value = Math.abs($el.value)">
                    </div>

                    <div class="w-32">
                        <label class="label py-0">
                            <span class="label-text text-[10px] font-black uppercase">Price / m</span>
                        </label>
                        <input type="number" name="price" step="0.01" min="0" placeholder="0.00"
                               class="input input-sm input-bordered w-full text-center font-bold"
                               @input="$el.value = Math.abs($el.value)">
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm px-6 font-black uppercase shadow-md">
                        Add Edge
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
